<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AWS Certified Cloud Practitioner - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;
      background:url(.github/social-preview-source.jpg) center/cover no-repeat;background-color:#dfe9f2}
.scrim{position:absolute;left:0;right:0;bottom:0;height:300px;
  background:linear-gradient(180deg,rgba(15,26,38,0) 0%,rgba(15,26,38,.62) 52%,rgba(15,26,38,.88) 100%)}
.copy{position:absolute;left:72px;bottom:56px;right:72px}
.k{font-size:14px;font-weight:700;letter-spacing:.24em;color:#FF9900}
.h1{margin-top:12px;font-size:52px;font-weight:800;line-height:1.06;letter-spacing:-.02em;color:#fff;
    text-shadow:0 2px 18px rgba(0,0,0,.45)}
.row{margin-top:18px;display:flex;align-items:baseline;gap:22px}
.code{font-size:22px;font-weight:800;letter-spacing:.10em;color:#FF9900}
.sep{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.by{font-size:19px;font-weight:600;color:#e8eef6}
</style>
<div class="card">
  <div class="scrim"></div>
  <div class="copy">
    <div class="k">CERTIFICATION &middot; SEMESTER VIII</div>
    <div class="h1">AWS Certified Cloud Practitioner</div>
    <div class="row"><span class="code">CLF-C01</span><span class="sep"></span>
      <span class="by">Amey Thakur &nbsp;&middot;&nbsp; Mega Satish</span></div>
  </div>
</div>
</body>
</html>
